<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="results.htm" method="get" enctype="multipart/form-data">
        <div>
            <label for="Name">Name</label>
            <input type="text" name="Name" id="name" placeholder="username" required>
        </div>
        <div>
            <label for="mail">Email</label>
            <input type="email" name="Email" id="email" placeholder="Email" required>
            
        </div>
        <div>
            <label for="age">Age</label>
            <input type="number" name="Age" id="age" placeholder="Age" required min="1" max="100" step="1">
        </div>
        <div>
            <label for="date">Date of Birth</label>
            <input type="date" name="date" id="date">
        </div>
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" name="phone" id="tel">
        </div>
        <div>
            <label for="url">Url</label>
            <input type="url" name="url" id="url">
        </div>
        <div>
            <label for="banana">Banana</label>
            <input type="checkbox" name="banana" id="banana">
        </div>
        <div>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male" value="female">
        </div>
        <div>
            <label for="Female">Male</label>
            <input type="radio" name="gender" id="Female" value="female">
        </div>
        <div>
            <label for="eyecolor">eyecolor</label>
            <select name="eyecolor" id="eyecolor">
            <option value="Brown">Brown</option>
            <option value="Black">Black</option>
            </select>
        </div>
        <div>
            <label for="bio">Bio</label>
            <textarea name="bio" id="bio">My name is</textarea>
        </div>
        <div>
            <label for="file">file</label>
            <input type="file" name="file" id="file"
        </div>
        <div>
            <label for="Password">Password</label>
            <input type="password" name="Password" id="password" placeholder="password" required>  
        </div>
        
        <button type="Submit">Submit</button>
    </form>
</body>
</html>
